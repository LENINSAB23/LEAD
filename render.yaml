services:
  - type: web
    name: lead-analytics
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lead-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: lead-postgres
    plan: free
    region: oregon
    databaseName: lead_db
    user: lead_admin
